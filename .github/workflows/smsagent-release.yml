# Релиз приложения для телефона ClinicHub SMS (SmsAgent), Issue #50.
#
# Запуск:
#   - тег smsagent-v<версия>, например:  git tag smsagent-v0.1.0  →  git push origin smsagent-v0.1.0
#     → подписанный APK ClinicHub-SmsAgent-0.1.0.apk в GitHub Releases;
#   - вручную (Actions → «Релиз SmsAgent» → Run workflow) — только сборка, APK в артефактах запуска, без релиза.
#   - на PR, если менялся этот файл или ClinicHub.SmsAgent.csproj, — так же, без релиза.
#
# Подпись — постоянным ключом из секретов репозитория (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Ключ создаётся один раз: tools/new-smsagent-keystore.ps1. Если секретов нет (форк и т. п.), сборка проходит
# с отладочной подписью и ничего не публикует.
#
# versionCode = номер запуска этого workflow (всегда растёт, поэтому каждая сборка ставится поверх предыдущей),
# versionName = версия из тега.
name: Релиз SmsAgent

on:
  push:
    tags: ["smsagent-v*"]
  workflow_dispatch:
  # Проверка самой сборки на PR, если она или проект менялись: APK в артефактах, без релиза.
  pull_request:
    paths:
      - .github/workflows/smsagent-release.yml
      - ClinicHub.SmsAgent/ClinicHub.SmsAgent.csproj

permissions:
  contents: write   # создать релиз

concurrency:
  group: smsagent-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  apk:
    name: APK SmsAgent
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Кэш пакетов NuGet
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-android-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-android-

      - name: Нагрузка MAUI (Android)
        run: dotnet workload install maui-android

      - name: Версия
        id: version
        run: |
          $ref = "${{ github.ref }}"
          $publish = "false"
          if ($ref -like "refs/tags/smsagent-v*") {
              $version = $ref.Substring("refs/tags/smsagent-v".Length)
              if ($version -notmatch '^\d+\.\d+\.\d+$') {
                  throw "Тег должен быть smsagent-v<число>.<число>.<число>, например smsagent-v0.1.0, а не '$ref'."
              }
              $publish = "true"
          } else {
              # Ручной запуск без тега — тестовая сборка, в релизы не попадает.
              $version = "0.0.${{ github.run_number }}-test"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "code=${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "versionName $version, versionCode ${{ github.run_number }}, публикация: $publish"

      - name: Ключ подписи из секретов
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if (-not $env:KEYSTORE_BASE64 -or -not $env:KEYSTORE_PASSWORD -or -not $env:KEY_ALIAS -or -not $env:KEY_PASSWORD) {
              Write-Host "::warning::Секретов подписи нет — собираю с отладочной подписью и ничего не публикую."
              "signed=false" >> $env:GITHUB_OUTPUT
              exit 0
          }
          # Файл ключа — во временной папке раннера, вне репозитория; после задачи раннер удаляется.
          $path = Join-Path $env:RUNNER_TEMP "smsagent.keystore"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64.Trim()))
          "signed=true" >> $env:GITHUB_OUTPUT
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Сборка APK
        env:
          # Пароли читает сама сборка Android из переменных окружения (env:…), в командной строке и журнале их нет.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $buildArgs = @(
              "publish", "ClinicHub.SmsAgent/ClinicHub.SmsAgent.csproj",
              "-f", "net10.0-android", "-c", "Release",
              "-p:AndroidPackageFormat=apk",
              "-p:AcceptAndroidSDKLicenses=True",
              "-p:ApplicationDisplayVersion=${{ steps.version.outputs.version }}",
              "-p:ApplicationVersion=${{ steps.version.outputs.code }}"
          )
          if ("${{ steps.keystore.outputs.signed }}" -eq "true") {
              $buildArgs += @(
                  "-p:AndroidKeyStore=true",
                  "-p:AndroidSigningKeyStore=${{ steps.keystore.outputs.path }}",
                  "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS",
                  "-p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD",
                  "-p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD"
              )
          }
          dotnet @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "Сборка APK не удалась." }

          # Готовый файл: bin\Release\net10.0-android\publish\ru.regenika.clinichub.smsagent-Signed.apk
          $apk = Get-ChildItem "ClinicHub.SmsAgent/bin/Release/net10.0-android/publish" -Filter "*-Signed.apk" |
              Select-Object -First 1
          if (-not $apk) { throw "После сборки не найден *-Signed.apk в ClinicHub.SmsAgent/bin/Release/net10.0-android/publish." }
          $name = "ClinicHub-SmsAgent-${{ steps.version.outputs.version }}.apk"
          Copy-Item $apk.FullName $name
          Write-Host "APK: $name ($([math]::Round((Get-Item $name).Length / 1MB, 1)) МБ)"

      - name: Проверка подписи
        if: steps.keystore.outputs.signed == 'true'
        run: |
          # apksigner из Android SDK раннера. Отпечаток должен совпадать с записанным в smsagent-signing.txt.
          $apksigner = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Filter apksigner.bat -Recurse |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $apksigner) { Write-Host "::warning::apksigner не найден, подпись не проверена."; exit 0 }
          & $apksigner.FullName verify --print-certs "ClinicHub-SmsAgent-${{ steps.version.outputs.version }}.apk"
          if ($LASTEXITCODE -ne 0) { throw "APK не прошёл проверку подписи." }

      - name: APK в артефакты запуска
        uses: actions/upload-artifact@v4
        with:
          name: ClinicHub-SmsAgent-${{ steps.version.outputs.version }}
          path: ClinicHub-SmsAgent-${{ steps.version.outputs.version }}.apk
          retention-days: 30

      - name: Релиз на GitHub
        if: steps.version.outputs.publish == 'true' && steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $notes = @"
          Приложение для телефона-шлюза SMS клиники.

          Установка: откройте эту страницу в браузере телефона, скачайте ClinicHub-SmsAgent-$version.apk и установите
          (разрешите установку из браузера). На Android 13 и новее: «Настройки» → «Приложения» → ClinicHub SMS → ⋮ →
          «Разрешить ограниченные настройки», затем выдайте разрешение на SMS. Подробно — README, раздел 3.

          Обновление ставится поверх прежней версии, настройки подключения сохраняются.
          Версия $version, сборка ${{ steps.version.outputs.code }}.
          "@
          gh release create "${{ github.ref_name }}" "ClinicHub-SmsAgent-$version.apk" `
              --title "ClinicHub SMS $version" --notes $notes
